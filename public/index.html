<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق دردشة ومكالمات فوري</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: Tahoma, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 0; display: flex; flex-direction: column; height: 100vh; }
        #header { background: #1e293b; color: white; padding: 15px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.3); }
        #header h2 { margin: 0; font-size: 18px; color: #38bdf8; }
        #call-btn { background: #10b981; color: white; border: none; padding: 8px 15px; border-radius: 20px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        #call-btn:hover { background: #059669; }
        
        #messages { list-style-type: none; margin: 0; padding: 20px; flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        #messages li { padding: 12px 16px; border-radius: 16px; max-width: 75%; word-break: break-word; line-height: 1.5; font-size: 14px; }
        .message-incoming { background: #1e293b; color: #f8fafc; align-self: flex-start; border-bottom-left-radius: 4px; }
        .message-outgoing { background: #0284c7; color: white; align-self: flex-end; border-bottom-right-radius: 4px; }
        .message-user { font-size: 11px; opacity: 0.7; margin-bottom: 4px; display: block; font-weight: bold; }

        #form { background: #1e293b; padding: 15px; display: flex; gap: 10px; box-shadow: 0 -4px 6px -1px rgba(0,0,0,0.3); }
        #input-name { width: 110px; padding: 12px; background: #0f172a; border: 1px solid #334155; color: white; border-radius: 25px; outline: none; text-align: center; }
        #input-message { flex: 1; padding: 12px 18px; background: #0f172a; border: 1px solid #334155; color: white; border-radius: 25px; outline: none; }
        #form button { background: #0284c7; color: white; border: none; padding: 0 25px; border-radius: 25px; cursor: pointer; font-weight: bold; transition: 0.2s; }
        #form button:hover { background: #0369a1; }

        /* نافذة الاتصال المنبثقة */
        #call-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 999; justify-content: center; align-items: center; }
        .modal-content { background: #1e293b; padding: 30px; border-radius: 20px; text-align: center; width: 320px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid #334155; }
        .modal-content h3 { margin-top: 0; color: #f8fafc; }
        .modal-buttons { display: flex; justify-content: center; gap: 15px; margin-top: 25px; }
        .btn-accept { background: #10b981; color: white; border: none; padding: 10px 20px; border-radius: 15px; cursor: pointer; font-weight: bold; }
        .btn-reject { background: #ef4444; color: white; border: none; padding: 10px 20px; border-radius: 15px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div id="header">
        <h2>دردشة فورية</h2>
        <button id="call-btn" onclick="startCall()">📞 اتصال صوتي</button>
    </div>

    <ul id="messages"></ul>

    <form id="form">
        <input id="input-name" autocomplete="off" placeholder="اسمك..." required />
        <input id="input-message" autocomplete="off" placeholder="اكتب رسالتك..." required />
        <button>إرسال</button>
    </form>

    <!-- نافذة الاتصال الوارد -->
    <div id="call-modal">
        <div class="modal-content">
            <h3 id="caller-text">هل تريد الانضمام إلى الاتصال؟</h3>
            <div class="modal-buttons">
                <button class="btn-accept" onclick="acceptCall()">موافقة</button>
                <button class="btn-reject" onclick="rejectCall()">رفض</button>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let myId = '';
        let incomingCallerId = '';

        socket.on('your-id', (id) => {
            myId = id;
        });

        const form = document.getElementById('form');
        const inputMessage = document.getElementById('input-message');
        const inputName = document.getElementById('input-name');
        const messages = document.getElementById('messages');

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            if (inputMessage.value && inputName.value) {
                socket.emit('chat message', { name: inputName.value, text: inputMessage.value });
                inputMessage.value = '';
            }
        });

        socket.on('chat message', (data) => {
            const item = document.createElement('li');
            item.className = (data.name === inputName.value) ? 'message-outgoing' : 'message-incoming';
            item.innerHTML = `<span class="message-user">${data.name}</span>${data.text}`;
            messages.appendChild(item);
            window.scrollTo(0, document.body.scrollHeight);
        });

        // طلب اتصال
        function startCall() {
            const name = inputName.value || 'مستخدم';
            socket.emit('call-request', { name: name });
            alert('تم إرسال طلب الاتصال بانتظار الرد...');
        }

        // استقبال طلب الاتصال
        socket.on('incoming-call', (data) => {
            incomingCallerId = data.from;
            document.getElementById('caller-text').innerText = `${data.name} يطلب الانضمام إلى الاتصال، هل تريد القبول؟`;
            document.getElementById('call-modal').style.display = 'flex';
        });

        function acceptCall() {
            document.getElementById('call-modal').style.display = 'none';
            socket.emit('call-response', { to: incomingCallerId, accepted: true });
            alert('تم قبول الاتصال بنجاح!');
        }

        function rejectCall() {
            document.getElementById('call-modal').style.display = 'none';
            socket.emit('call-response', { to: incomingCallerId, accepted: false });
        }

        socket.on('call-status', (data) => {
            if (data.accepted) {
                alert('تم قبول الاتصال من قبل الطرف الآخر!');
            } else {
                alert('تم رفض الاتصال.');
            }
        });
    </script>
</body>
</html>

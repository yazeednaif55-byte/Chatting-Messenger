<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تطبيق المحادثات الذكي</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-main: #090d16;
            --bg-sidebar: #0f172a;
            --bg-card: #1e293b;
            --text-main: #f1f5f9;
            --text-sub: #94a3b8;
            --accent: #0284c7;
            --accent-hover: #0369a1;
            --border: rgba(255, 255, 255, 0.08);
            --msg-in: #1e293b;
            --msg-out: linear-gradient(135deg, #0284c7, #2563eb);
        }

        [data-theme="light"] {
            --bg-main: #f8fafc;
            --bg-sidebar: #f1f5f9;
            --bg-card: #ffffff;
            --text-main: #0f172a;
            --text-sub: #64748b;
            --accent: #0284c7;
            --border: rgba(0, 0, 0, 0.08);
            --msg-in: #e2e8f0;
            --msg-out: linear-gradient(135deg, #0284c7, #2563eb);
        }

        * { box-sizing: border-box; font-family: 'Cairo', sans-serif; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg-main); color: var(--text-main); height: 100vh; display: flex; overflow: hidden; transition: background 0.3s, color 0.3s; }

        /* شاشة تسجيل الدخول */
        #login-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg-main); z-index: 2000; display: flex; justify-content: center; align-items: center; padding: 20px; }
        .login-card { background: var(--bg-card); border: 1px solid var(--border); padding: 35px 25px; border-radius: 24px; width: 100%; max-width: 380px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.3); }
        .login-card h2 { color: #38bdf8; font-size: 22px; margin-bottom: 8px; font-weight: 800; }
        .login-card p { color: var(--text-sub); font-size: 13px; margin-bottom: 20px; }
        .login-input { width: 100%; padding: 14px; background: var(--bg-main); border: 1px solid var(--border); border-radius: 14px; color: var(--text-main); font-size: 15px; margin-bottom: 18px; outline: none; text-align: center; }
        .btn-main { width: 100%; padding: 14px; background: var(--accent); color: white; border: none; border-radius: 14px; font-weight: 700; font-size: 15px; cursor: pointer; }

        /* التخطيط العام */
        #app-layout { display: flex; width: 100vw; height: 100vh; position: relative; }

        /* الشريط الجانبي (قائمة اليوزرات) */
        #sidebar { width: 320px; background: var(--bg-sidebar); border-left: 1px solid var(--border); display: flex; flex-direction: column; z-index: 10; transition: transform 0.3s ease; }
        .sidebar-header { padding: 16px 20px; background: var(--bg-card); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .sidebar-header h3 { font-size: 16px; color: #38bdf8; font-weight: 800; }
        .header-btns { display: flex; gap: 8px; }
        .icon-btn { background: var(--bg-main); border: 1px solid var(--border); color: var(--text-main); width: 36px; height: 36px; border-radius: 10px; cursor: pointer; font-size: 16px; display: flex; justify-content: center; align-items: center; }
        
        #user-list { list-style: none; overflow-y: auto; flex: 1; padding: 12px; }
        .user-item { padding: 12px 16px; border-radius: 16px; margin-bottom: 8px; cursor: pointer; background: var(--bg-card); display: flex; align-items: center; justify-content: space-between; border: 1px solid var(--border); transition: 0.2s; }
        .user-item:hover, .user-item.active { background: var(--accent); color: white; }
        .badge-online { width: 10px; height: 10px; background: #4ade80; border-radius: 50%; box-shadow: 0 0 8px #4ade80; }

        /* منطقة الشات */
        #chat-area { flex: 1; display: flex; flex-direction: column; background: var(--bg-main); position: relative; }
        #chat-header { padding: 14px 20px; background: var(--bg-card); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
        .chat-title { display: flex; align-items: center; gap: 12px; }
        .btn-back { display: none; background: var(--bg-main); border: 1px solid var(--border); color: var(--text-main); padding: 6px 12px; border-radius: 10px; font-weight: bold; font-size: 13px; cursor: pointer; }
        .user-status-text { font-size: 11px; color: #38bdf8; min-height: 16px; }

        .btn-call { background: #10b981; color: white; border: none; padding: 8px 16px; border-radius: 12px; font-weight: 700; cursor: pointer; display: none; font-size: 13px; }

        /* منطقة الرسائل */
        #messages-container { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; background-size: cover; background-position: center; }
        .message-box { max-width: 75%; padding: 12px 16px; border-radius: 18px; font-size: 14px; word-break: break-word; line-height: 1.5; }
        .message-incoming { background: var(--msg-in); color: var(--text-main); align-self: flex-start; border-bottom-right-radius: 4px; border: 1px solid var(--border); }
        .message-outgoing { background: var(--msg-out); color: white; align-self: flex-end; border-bottom-left-radius: 4px; }

        /* مؤشر الكتابة */
        .typing-dots { display: inline-flex; gap: 4px; align-items: center; }
        .typing-dots span { width: 4px; height: 4px; background: #38bdf8; border-radius: 50%; animation: blink 1.4s infinite ease-in-out both; }
        .typing-dots span:nth-child(1) { animation-delay: -0.32s; }
        .typing-dots span:nth-child(2) { animation-delay: -0.16s; }
        @keyframes blink { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }

        /* نموذج الإرسال */
        #chat-form { padding: 12px 16px; background: var(--bg-card); display: flex; gap: 10px; border-top: 1px solid var(--border); }
        #message-input { flex: 1; background: var(--bg-main); border: 1px solid var(--border); padding: 12px 16px; border-radius: 14px; color: var(--text-main); outline: none; font-size: 14px; }
        .btn-send { background: var(--accent); color: white; border: none; padding: 0 20px; border-radius: 14px; font-weight: 700; cursor: pointer; font-size: 14px; }

        /* نافذة الإعدادات */
        #settings-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); backdrop-filter: blur(8px); z-index: 3000; justify-content: center; align-items: center; padding: 20px; }
        .settings-card { background: var(--bg-card); border: 1px solid var(--border); padding: 25px; border-radius: 20px; width: 100%; max-width: 400px; }
        .settings-card h3 { font-size: 18px; margin-bottom: 20px; color: #38bdf8; text-align: center; }
        .setting-group { margin-bottom: 18px; }
        .setting-group label { font-size: 13px; color: var(--text-sub); display: block; margin-bottom: 6px; font-weight: bold; }
        .setting-select { width: 100%; padding: 10px; background: var(--bg-main); border: 1px solid var(--border); color: var(--text-main); border-radius: 10px; outline: none; }
        .btn-close-settings { width: 100%; padding: 12px; background: #ef4444; color: white; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; margin-top: 10px; }

        /* نافذة طلب الاتصال */
        #call-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(8px); z-index: 4000; justify-content: center; align-items: center; }
        .modal-card { background: var(--bg-card); padding: 30px; border-radius: 24px; text-align: center; width: 300px; border: 1px solid var(--border); }
        .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
        .btn-accept { background: #10b981; color: white; border: none; padding: 12px; border-radius: 12px; flex: 1; cursor: pointer; font-weight: bold; }
        .btn-reject { background: #ef4444; color: white; border: none; padding: 12px; border-radius: 12px; flex: 1; cursor: pointer; font-weight: bold; }

        /* شاشة الفيديوهات والمكالمات */
        #video-screen { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 5000; flex-direction: column; }
        .video-container { flex: 1; position: relative; display: flex; justify-content: center; align-items: center; }
        #remote-video { width: 100%; height: 100%; object-fit: cover; }
        #local-video { position: absolute; top: 20px; right: 20px; width: 110px; height: 150px; border-radius: 16px; border: 2px solid #fff; object-fit: cover; box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        .call-controls { padding: 20px; background: #0f172a; display: flex; justify-content: center; gap: 20px; }
        .btn-ctrl { width: 50px; height: 50px; border-radius: 50%; border: none; background: #334155; color: white; font-size: 18px; cursor: pointer; }
        .btn-end { background: #ef4444; }

        /* تجاوب الشاشات للجوال والايباد */
        @media (max-width: 768px) {
            #sidebar { width: 100%; position: absolute; top: 0; left: 0; height: 100%; }
            #sidebar.hide-mobile { transform: translateX(100%); }
            [dir="ltr"] #sidebar.hide-mobile { transform: translateX(-100%); }
            .btn-back { display: block; }
        }
    </style>
</head>
<body>

    <!-- شاشة تسجيل الدخول -->
    <div id="login-screen">
        <div class="login-card">
            <h2 id="txt-login-title">دخول الحساب 👤</h2>
            <p id="txt-login-sub">اكتب اسم المستخدم للبدء بالمحادثات</p>
            <input type="text" id="username-input" class="login-input" placeholder="اسم المستخدم..." autocomplete="off">
            <button class="btn-main" id="btn-login" onclick="registerUser()">دخول</button>
        </div>
    </div>

    <!-- التخطيط الرئيسي -->
    <div id="app-layout">
        <!-- القائمة الجانبية -->
        <div id="sidebar">
            <div class="sidebar-header">
                <div>
                    <h3 id="txt-users-title">المتصلون</h3>
                    <span style="font-size: 11px; color: var(--text-sub);" id="my-username-display"></span>
                </div>
                <div class="header-btns">
                    <button class="icon-btn" onclick="openSettings()">⚙️</button>
                    <button class="icon-btn" onclick="logout()">🚪</button>
                </div>
            </div>
            <ul id="user-list"></ul>
        </div>

        <!-- منطقة الشات -->
        <div id="chat-area">
            <div id="chat-header">
                <div class="chat-title">
                    <button class="btn-back" onclick="goBackToList()">⬅️ <span id="txt-back">رجوع</span></button>
                    <div>
                        <h4 id="active-chat-user">اختر شخصاً للبدء</h4>
                        <div class="user-status-text" id="user-status-text"></div>
                    </div>
                </div>
                <button class="btn-call" id="call-btn" onclick="initiatePrivateCall()">📞 <span id="txt-call">اتصال</span></button>
            </div>

            <div id="messages-container"></div>

            <form id="chat-form" onsubmit="sendPrivateMessage(event)">
                <input type="text" id="message-input" placeholder="اكتب رسالتك..." autocomplete="off" disabled required oninput="handleTyping()">
                <button type="submit" class="btn-send" id="send-btn" disabled>إرسال</button>
            </form>
        </div>
    </div>

    <!-- نافذة الإعدادات -->
    <div id="settings-modal">
        <div class="settings-card">
            <h3 id="txt-settings-title">الإعدادات ⚙️</h3>
            
            <div class="setting-group">
                <label id="lbl-theme">المظهر / الثيم:</label>
                <select id="theme-select" class="setting-select" onchange="changeTheme(this.value)">
                    <option value="system">تلقائي (حسب النظام)</option>
                    <option value="dark">داكن (Dark)</option>
                    <option value="light">فاتح (Light)</option>
                </select>
            </div>

            <div class="setting-group">
                <label id="lbl-lang">اللغة:</label>
                <select id="lang-select" class="setting-select" onchange="changeLanguage(this.value)">
                    <option value="system">تلقائي (حسب جهازك)</option>
                    <option value="ar">العربية (Arabic)</option>
                    <option value="en">English</option>
                    <option value="fr">Français</option>
                    <option value="es">Español</option>
                    <option value="de">Deutsch</option>
                </select>
            </div>

            <button class="btn-close-settings" onclick="closeSettings()">إغلاق</button>
        </div>
    </div>

    <!-- نافذة طلب الاتصال -->
    <div id="call-modal">
        <div class="modal-card">
            <h3 id="caller-text">يوزر يدعوك لمكالمة</h3>
            <div class="modal-actions">
                <button class="btn-accept" onclick="acceptCall()">قبول</button>
                <button class="btn-reject" onclick="rejectCall()">رفض</button>
            </div>
        </div>
    </div>

    <!-- شاشة المكالمة المرئية -->
    <div id="video-screen">
        <div class="video-container">
            <video id="remote-video" autoplay playsinline></video>
            <video id="local-video" autoplay playsinline muted></video>
        </div>
        <div class="call-controls">
            <button class="btn-ctrl" onclick="toggleAudio()">🎤</button>
            <button class="btn-ctrl btn-end" onclick="endCall()">🛑</button>
            <button class="btn-ctrl" onclick="toggleVideo()">📹</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let myUsername = '';
        let selectedUser = null;
        let privateStore = {};
        let targetSocketId = null;
        let localStream = null;
        let peerConnection = null;
        let typingTimeout = null;

        const translations = {
            ar: { loginTitle: 'دخول الحساب 👤', loginSub: 'اكتب اسم المستخدم للبدء بالمحادثات', usersTitle: 'المتصلون', selectUser: 'اختر شخصاً للبدء', back: 'رجوع', call: 'اتصال', settings: 'الإعدادات ⚙️', theme: 'المظهر / الثيم:', lang: 'اللغة:', typing: 'يكتب الآن...' },
            en: { loginTitle: 'User Login 👤', loginSub: 'Enter username to start chatting', usersTitle: 'Online Users', selectUser: 'Select a user to chat', back: 'Back', call: 'Call', settings: 'Settings ⚙️', theme: 'Theme:', lang: 'Language:', typing: 'typing...' },
            fr: { loginTitle: 'Connexion 👤', loginSub: 'Entrez un nom d\'utilisateur', usersTitle: 'En ligne', selectUser: 'Sélectionnez un utilisateur', back: 'Retour', call: 'Appeler', settings: 'Paramètres ⚙️', theme: 'Thème:', lang: 'Langue:', typing: 'écrit...' },
            es: { loginTitle: 'Iniciar sesión 👤', loginSub: 'Ingrese nombre de usuario', usersTitle: 'En línea', selectUser: 'Seleccione un usuario', back: 'Atrás', call: 'Llamar', settings: 'Ajustes ⚙️', theme: 'Tema:', lang: 'Idioma:', typing: 'escribiendo...' },
            de: { loginTitle: 'Anmelden 👤', loginSub: 'Benutzernamen eingeben', usersTitle: 'Online', selectUser: 'Wählen Sie einen Benutzer', back: 'Zurück', call: 'Anrufen', settings: 'Einstellungen ⚙️', theme: 'Design:', lang: 'Sprache:', typing: 'schreibt...' }
        };

        const rtcConfig = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' }
            ]
        };

        window.onload = () => {
            applySavedSettings();
            const savedUsername = localStorage.getItem('app_saved_user');
            if (savedUsername) {
                myUsername = savedUsername;
                loginSuccess();
            }
        };

        function registerUser() {
            const input = document.getElementById('username-input').value.trim();
            if (input) {
                myUsername = input;
                localStorage.setItem('app_saved_user', myUsername);
                loginSuccess();
            }
        }

        function loginSuccess() {
            socket.emit('register-user', myUsername);
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('my-username-display').innerText = `@${myUsername}`;
        }

        function logout() {
            localStorage.removeItem('app_saved_user');
            location.reload();
        }

        // تحديث القائمة
        socket.on('update-user-list', (userArray) => {
            const list = document.getElementById('user-list');
            list.innerHTML = '';
            userArray.forEach(user => {
                if (user !== myUsername) {
                    const li = document.createElement('li');
                    li.className = `user-item ${selectedUser === user ? 'active' : ''}`;
                    li.innerHTML = `<span>@${user}</span><span class="badge-online"></span>`;
                    li.onclick = () => selectUserChat(user);
                    list.appendChild(li);
                }
            });
        });

        function selectUserChat(user) {
            selectedUser = user;
            document.getElementById('active-chat-user').innerText = `@${user}`;
            document.getElementById('message-input').disabled = false;
            document.getElementById('send-btn').disabled = false;
            document.getElementById('call-btn').style.display = 'block';

            // للجوال: إخفاء القائمة الجانبية عند اختيار يوزر
            document.getElementById('sidebar').classList.add('hide-mobile');

            renderMessages();
        }

        function goBackToList() {
            document.getElementById('sidebar').classList.remove('hide-mobile');
        }

        // جاري الكتابة (Typing Indicator)
        function handleTyping() {
            if (!selectedUser) return;
            socket.emit('typing', { to: selectedUser, from: myUsername, isTyping: true });
            
            clearTimeout(typingTimeout);
            typingTimeout = setTimeout(() => {
                socket.emit('typing', { to: selectedUser, from: myUsername, isTyping: false });
            }, 1500);
        }

        socket.on('typing', (data) => {
            if (selectedUser === data.from) {
                const statusElem = document.getElementById('user-status-text');
                if (data.isTyping) {
                    const lang = getCurrentLang();
                    statusElem.innerHTML = `${translations[lang].typing} <span class="typing-dots"><span></span><span></span><span></span></span>`;
                } else {
                    statusElem.innerText = '';
                }
            }
        });

        // إرسال رسالة
        function sendPrivateMessage(e) {
            e.preventDefault();
            const input = document.getElementById('message-input');
            const text = input.value.trim();

            if (text && selectedUser) {
                if (!privateStore[selectedUser]) privateStore[selectedUser] = [];
                privateStore[selectedUser].push({ from: myUsername, text: text });

                socket.emit('private-message', { to: selectedUser, from: myUsername, text: text });
                socket.emit('typing', { to: selectedUser, from: myUsername, isTyping: false });
                input.value = '';
                renderMessages();
            }
        }

        socket.on('private-message', (data) => {
            if (!privateStore[data.from]) privateStore[data.from] = [];
            privateStore[data.from].push({ from: data.from, text: data.text });

            if (selectedUser === data.from) {
                renderMessages();
            }
        });

        function renderMessages() {
            const container = document.getElementById('messages-container');
            container.innerHTML = '';
            const messages = privateStore[selectedUser] || [];

            messages.forEach(msg => {
                const box = document.createElement('div');
                const isMe = msg.from === myUsername;
                box.className = `message-box ${isMe ? 'message-outgoing' : 'message-incoming'}`;
                box.innerText = msg.text;
                container.appendChild(box);
            });
            container.scrollTop = container.scrollHeight;
        }

        // --- المكالمات المرئية والصوتية (WebRTC Fix) ---
        function initiatePrivateCall() {
            if (!selectedUser) return;
            socket.emit('call-request', { to: selectedUser, from: myUsername });
            alert(`جاري الاتصال بـ @${selectedUser}...`);
        }

        socket.on('incoming-call', (data) => {
            targetSocketId = data.fromSocketId;
            document.getElementById('caller-text').innerText = `@${data.fromUser} يتصل بك!`;
            document.getElementById('call-modal').style.display = 'flex';
        });

        async function acceptCall() {
            document.getElementById('call-modal').style.display = 'none';
            socket.emit('call-response', { toSocketId: targetSocketId, accepted: true });
            await startLocalStream();
            createPeerConnection();
        }

        function rejectCall() {
            document.getElementById('call-modal').style.display = 'none';
            socket.emit('call-response', { toSocketId: targetSocketId, accepted: false });
        }

        socket.on('call-status', async (data) => {
            if (data.accepted) {
                targetSocketId = data.fromSocketId;
                await startLocalStream();
                createPeerConnection();

                const offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);
                socket.emit('webrtc-offer', { toSocketId: targetSocketId, sdp: offer });
            } else {
                alert('تم رفض الاتصال.');
            }
        });

        // ضبط المايك والكاميرا بأعلى توافقية للجوال والكمبيوتر
        async function startLocalStream() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({
                    video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: "user" },
                    audio: { echoCancellation: true, noiseSuppression: true }
                });
                document.getElementById('local-video').srcObject = localStream;
                document.getElementById('video-screen').style.display = 'flex';
            } catch (err) {
                alert('يرجى السماح بصلاحيات الصوت والكاميرا!');
                console.error(err);
            }
        }

        function createPeerConnection() {
            peerConnection = new RTCPeerConnection(rtcConfig);
            localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

            peerConnection.ontrack = (e) => {
                const remoteVideo = document.getElementById('remote-video');
                if (remoteVideo.srcObject !== e.streams[0]) {
                    remoteVideo.srcObject = e.streams[0];
                }
            };

            peerConnection.onicecandidate = (e) => {
                if (e.candidate) {
                    socket.emit('webrtc-ice-candidate', { toSocketId: targetSocketId, candidate: e.candidate });
                }
            };
        }

        socket.on('webrtc-offer', async (data) => {
            if (!peerConnection) createPeerConnection();
            await peerConnection.setRemoteDescription(new RTCSessionDescription(data.sdp));
            const answer = await peerConnection.createAnswer();
            await peerConnection.setLocalDescription(answer);
            socket.emit('webrtc-answer', { toSocketId: targetSocketId, sdp: answer });
        });

        socket.on('webrtc-answer', async (data) => {
            await peerConnection.setRemoteDescription(new RTCSessionDescription(data.sdp));
        });

        socket.on('webrtc-ice-candidate', async (data) => {
            if (peerConnection && data.candidate) {
                await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
            }
        });

        function toggleAudio() {
            if (localStream) {
                const track = localStream.getAudioTracks()[0];
                track.enabled = !track.enabled;
            }
        }

        function toggleVideo() {
            if (localStream) {
                const track = localStream.getVideoTracks()[0];
                track.enabled = !track.enabled;
            }
        }

        function endCall() {
            if (localStream) localStream.getTracks().forEach(t => t.stop());
            if (peerConnection) peerConnection.close();
            document.getElementById('video-screen').style.display = 'none';
            location.reload();
        }

        // --- الإعدادات والثيمات واللغات ---
        function openSettings() { document.getElementById('settings-modal').style.display = 'flex'; }
        function closeSettings() { document.getElementById('settings-modal').style.display = 'none'; }

        function changeTheme(theme) {
            localStorage.setItem('app_theme', theme);
            if (theme === 'system') {
                const isDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
                document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
            } else {
                document.documentElement.setAttribute('data-theme', theme);
            }
        }

        function changeLanguage(lang) {
            localStorage.setItem('app_lang', lang);
            applyLanguage(lang);
        }

        function getCurrentLang() {
            let lang = localStorage.getItem('app_lang') || 'system';
            if (lang === 'system') {
                const sysLang = navigator.language.slice(0, 2);
                return translations[sysLang] ? sysLang : 'ar';
            }
            return lang;
        }

        function applyLanguage(lang) {
            const activeLang = (lang === 'system') ? getCurrentLang() : lang;
            const t = translations[activeLang] || translations.ar;

            document.documentElement.dir = (activeLang === 'ar') ? 'rtl' : 'ltr';
            document.getElementById('txt-login-title').innerText = t.loginTitle;
            document.getElementById('txt-login-sub').innerText = t.loginSub;
            document.getElementById('txt-users-title').innerText = t.usersTitle;
            if (!selectedUser) document.getElementById('active-chat-user').innerText = t.selectUser;
            document.getElementById('txt-back').innerText = t.back;
            document.getElementById('txt-call').innerText = t.call;
            document.getElementById('txt-settings-title').innerText = t.settings;
            document.getElementById('lbl-theme').innerText = t.theme;
            document.getElementById('lbl-lang').innerText = t.lang;
        }

        function applySavedSettings() {
            const savedTheme = localStorage.getItem('app_theme') || 'system';
            const savedLang = localStorage.getItem('app_lang') || 'system';
            document.getElementById('theme-select').value = savedTheme;
            document.getElementById('lang-select').value = savedLang;
            changeTheme(savedTheme);
            applyLanguage(savedLang);
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ماسنجر الدردشة</title>
  <script src="/socket.io/socket.io.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background-color: #f4f7f6; display: flex; justify-content: center; align-items: center; height: 100vh; }
    
    .app-container { 
      width: 100%; max-width: 420px; height: 100%; max-height: 850px; 
      background: white; display: flex; flex-direction: column; 
      position: relative; box-shadow: 0 4px 20px rgba(0,0,0,0.1); border-radius: 20px; overflow: hidden; 
    }
    
    .header { padding: 20px; text-align: center; border-bottom: 1px solid #eee; }
    .header h2 { font-size: 22px; color: #333; margin-top: 5px; }
    
    .chat-list { flex: 1; overflow-y: auto; padding: 15px; }
    .chat-item { display: flex; align-items: center; padding: 10px 0; border-bottom: 1px solid #f9f9f9; }
    .chat-item img { width: 50px; height: 50px; border-radius: 50%; margin-left: 15px; object-fit: cover; }
    .chat-info h4 { font-size: 16px; color: #333; }
    .chat-info p { font-size: 13px; color: #777; margin-top: 3px; }

    /* زر الـ + والقائمة المنبثقة */
    .floating-action { position: absolute; bottom: 80px; left: 20px; z-index: 100; }
    .plus-btn { 
      width: 50px; height: 50px; border-radius: 50%; background: #0072FF; 
      color: white; border: none; font-size: 28px; cursor: pointer; 
      box-shadow: 0 4px 10px rgba(0,114,255,0.3); display: flex; align-items: center; justify-content: center; 
    }
    .media-menu { 
      display: none; position: absolute; bottom: 60px; left: 0; 
      background: white; border-radius: 12px; box-shadow: 0 5px 20px rgba(0,0,0,0.15); 
      width: 150px; overflow: hidden; text-align: right; z-index: 101; 
    }
    .media-menu label, .media-menu div { 
      display: block; padding: 12px 15px; cursor: pointer; 
      border-bottom: 1px solid #f0f0f0; font-size: 14px; color: #333; 
    }

    /* شاشة المكالمة */
    #callScreen { 
      display: none; position: fixed; top: 0; left: 0; 
      width: 100vw; height: 100vh; background-color: #111; z-index: 9999; 
    }
    #callStatus { 
      position: absolute; top: 40px; width: 100%; text-align: center; 
      color: white; font-size: 18px; font-weight: bold; z-index: 10000; 
    }
    #remoteVideo { width: 100%; height: 100%; object-fit: cover; }
    #localVideo { 
      width: 100px; height: 150px; position: absolute; bottom: 100px; right: 20px; 
      border-radius: 12px; border: 2px solid #fff; object-fit: cover; z-index: 10001; 
    }
    .call-controls { 
      position: absolute; bottom: 30px; left: 0; right: 0; 
      display: flex; justify-content: center; gap: 15px; z-index: 10002; 
    }
    .call-controls button { 
      padding: 12px 18px; border-radius: 25px; border: none; 
      background: #333; color: white; font-size: 14px; cursor: pointer; 
    }
    .call-controls .danger-btn { background: #e74c3c; font-weight: bold; }

    /* شريط التنقل */
    .nav-bar { display: flex; justify-content: space-around; padding: 12px; border-top: 1px solid #eee; background: #fff; }
    .nav-item { font-size: 12px; color: #777; text-align: center; cursor: pointer; }
  </style>
</head>
<body>

  <div class="app-container">
    <div class="header">
      <!-- صورة الشعار SVG -->
      <svg width="50" height="50" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" style="margin: 0 auto; display: block;">
        <path d="M12 2C6.48 2 2 6.03 2 11C2 13.56 3.17 15.85 5.02 17.47C4.94 18.25 4.63 19.38 3.9 20.35C5.46 20.47 7.78 20.08 9.29 19.12C10.15 19.37 11.06 19.5 12 19.5C17.52 19.5 22 15.47 22 10.5C22 5.53 17.52 2 12 2Z" fill="#0072FF"/>
      </svg>
      <h2>ماسنجر الدردشة</h2>
    </div>

    <div class="chat-list">
      <div class="chat-item">
        <img src="https://via.placeholder.com/50" alt="user">
        <div class="chat-info">
          <h4>أحمد علي</h4>
          <p>مرحباً، كيف حالك؟</p>
        </div>
      </div>
    </div>

    <!-- زر الـ + وقائمة الصور والفيديو و GIF -->
    <div class="floating-action">
      <button class="plus-btn" onclick="toggleAddMenu()">+</button>
      <div id="mediaAddMenu" class="media-menu">
        <label for="imageInput">🖼️ الصور</label>
        <input type="file" id="imageInput" accept="image/*" style="display: none;" onchange="sendMediaFile(this, 'image')">
        
        <label for="videoInput">📹 الفيديو</label>
        <input type="file" id="videoInput" accept="video/*" style="display: none;" onchange="sendMediaFile(this, 'video')">
        
        <div onclick="selectGif()">🎬 GIF</div>
      </div>
    </div>

    <div class="nav-bar">
      <div class="nav-item">💬 الدردشات</div>
      <div class="nav-item">📞 المكالمات</div>
      <div class="nav-item">👥 الأشخاص</div>
      <div class="nav-item">⚙️ الإعدادات</div>
    </div>
  </div>

  <!-- شاشة المكالمة الأزرار -->
  <div id="callScreen">
    <div id="callStatus">جاري الاتصال...</div>
    <video id="remoteVideo" autoplay playsinline></video>
    <video id="localVideo" autoplay playsinline muted></video>
    
    <div class="call-controls">
      <button id="toggleMicBtn" onclick="toggleMicrophone()">🎤 كتم المايك</button>
      <button id="toggleCamBtn" onclick="toggleCamera()">📹 إيقاف الكاميرا</button>
      <button id="endCallBtn" class="danger-btn" onclick="endCall()">📞 إلغاء المكالمة</button>
    </div>
  </div>

  <script>
    const socket = io();
    let localStream, peerConnection, targetUserId;

    function toggleAddMenu() {
      const menu = document.getElementById('mediaAddMenu');
      menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
    }

    function sendMediaFile(input, type) {
      if (input.files && input.files[0]) {
        console.log(`اختيار ${type}:`, input.files[0].name);
        document.getElementById('mediaAddMenu').style.display = 'none';
      }
    }

    function selectGif() {
      document.getElementById('mediaAddMenu').style.display = 'none';
      alert("فتح مكتبة الـ GIF");
    }

    // زر إنهاء/إلغاء المكالمة
    function endCall() {
      if (socket && targetUserId) {
        socket.emit('endCall', { to: targetUserId });
      }
      stopMediaStreams();
      document.getElementById('callStatus').innerText = "تم إلغاء المكالمة";
      setTimeout(() => {
        document.getElementById('callScreen').style.display = 'none';
      }, 1200);
    }

    // استقبال قفل المكالمة من الطرف الثاني
    socket.on('callEnded', () => {
      stopMediaStreams();
      document.getElementById('callStatus').innerText = "تم قفل المكالمة من الطرف الآخر";
      setTimeout(() => {
        document.getElementById('callScreen').style.display = 'none';
      }, 1500);
    });

    function stopMediaStreams() {
      if (localStream) {
        localStream.getTracks().forEach(track => track.stop());
        localStream = null;
      }
      document.getElementById('localVideo').srcObject = null;
      document.getElementById('remoteVideo').srcObject = null;
    }

    function toggleMicrophone() {
      if (localStream) {
        const track = localStream.getAudioTracks()[0];
        if (track) {
          track.enabled = !track.enabled;
          document.getElementById('toggleMicBtn').innerText = track.enabled ? '🎤 كتم المايك' : '🎙️ تشغيل المايك';
        }
      }
    }

    function toggleCamera() {
      if (localStream) {
        const track = localStream.getVideoTracks()[0];
        if (track) {
          track.enabled = !track.enabled;
          document.getElementById('toggleCamBtn').innerText = track.enabled ? '📹 إيقاف الكاميرا' : '📷 تفعيل الكاميرا';
        }
      }
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق المحادثات والمكالمات الخاصة</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; font-family: 'Cairo', sans-serif; margin: 0; padding: 0; }
        body { background: #090d16; color: #f1f5f9; height: 100vh; display: flex; overflow: hidden; }

        /* شاشة تسجيل الدخول باليوزر */
        #login-screen { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(9, 13, 22, 0.98); backdrop-filter: blur(10px); z-index: 1000; display: flex; justify-content: center; align-items: center; }
        .login-card { background: rgba(30, 41, 59, 0.7); border: 1px solid rgba(255, 255, 255, 0.1); padding: 40px; border-radius: 24px; width: 90%; max-width: 400px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.5); }
        .login-card h2 { color: #38bdf8; font-size: 24px; margin-bottom: 10px; font-weight: 700; }
        .login-card p { color: #94a3b8; font-size: 14px; margin-bottom: 25px; }
        .login-input { width: 100%; padding: 14px 20px; background: #0f172a; border: 1px solid #334155; border-radius: 14px; color: #fff; font-size: 15px; margin-bottom: 20px; outline: none; text-align: center; }
        .btn-main { width: 100%; padding: 14px; background: linear-gradient(135deg, #0284c7, #2563eb); color: white; border: none; border-radius: 14px; font-weight: 700; font-size: 16px; cursor: pointer; }

        /* الشاشة الرئيسية: تقسيم شريط اليوزرات والشات */
        #app-layout { display: flex; width: 100vw; height: 100vh; }

        /* الشريط الجانبي (قائمة اليوزرات) */
        #sidebar { width: 280px; background: #0f172a; border-left: 1px solid rgba(255, 255, 255, 0.05); display: flex; flex-direction: column; }
        .sidebar-header { padding: 15px 20px; background: #1e293b; border-bottom: 1px solid rgba(255, 255, 255, 0.05); display: flex; justify-content: space-between; align-items: center; }
        .sidebar-header h3 { font-size: 15px; color: #38bdf8; }
        .user-tag { font-size: 12px; color: #94a3b8; font-weight: bold; }
        .btn-logout { background: rgba(239, 68, 68, 0.2); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.3); padding: 4px 10px; border-radius: 8px; font-size: 11px; cursor: pointer; font-weight: bold; }
        .btn-logout:hover { background: #ef4444; color: white; }

        #user-list { list-style: none; overflow-y: auto; flex: 1; padding: 10px; }
        .user-item { padding: 12px 15px; border-radius: 12px; margin-bottom: 8px; cursor: pointer; background: rgba(30, 41, 59, 0.4); display: flex; align-items: center; justify-content: space-between; transition: 0.2s; }
        .user-item:hover, .user-item.active { background: #0284c7; color: white; }
        .badge-online { width: 8px; height: 8px; background: #4ade80; border-radius: 50%; }

        /* منطقة المحادثة */
        #chat-area { flex: 1; display: flex; flex-direction: column; background: #090d16; }
        #chat-header { padding: 15px 25px; background: rgba(30, 41, 59, 0.6); backdrop-filter: blur(12px); border-bottom: 1px solid rgba(255, 255, 255, 0.05); display: flex; justify-content: space-between; align-items: center; }
        .chat-title h4 { font-size: 18px; color: #f8fafc; }
        .btn-call { background: #10b981; color: white; border: none; padding: 10px 20px; border-radius: 12px; font-weight: 700; cursor: pointer; display: none; }

        /* الرسائل */
        #messages-container { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .message-box { max-width: 65%; padding: 12px 16px; border-radius: 18px; font-size: 14px; word-break: break-word; }
        .message-incoming { background: #1e293b; color: #f8fafc; align-self: flex-start; border-bottom-right-radius: 4px; }
        .message-outgoing { background: #0284c7; color: white; align-self: flex-end; border-bottom-left-radius: 4px; }

        /* نموذج الإرسال */
        #chat-form { padding: 15px 20px; background: rgba(30, 41, 59, 0.6); display: flex; gap: 10px; border-top: 1px solid rgba(255, 255, 255, 0.05); }
        #message-input { flex: 1; background: #0f172a; border: 1px solid #334155; padding: 12px 18px; border-radius: 14px; color: white; outline: none; }
        .btn-send { background: #0284c7; color: white; border: none; padding: 0 20px; border-radius: 14px; font-weight: 700; cursor: pointer; }

        /* نافذة الاتصال */
        #call-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(8px); z-index: 2000; justify-content: center; align-items: center; }
        .modal-card { background: #1e293b; padding: 30px; border-radius: 20px; text-align: center; width: 320px; }
        .modal-actions { display: flex; gap: 10px; margin-top: 20px; }
        .btn-accept { background: #10b981; color: white; border: none; padding: 10px; border-radius: 10px; flex: 1; cursor: pointer; font-weight: bold; }
        .btn-reject { background: #ef4444; color: white; border: none; padding: 10px; border-radius: 10px; flex: 1; cursor: pointer; font-weight: bold; }

        /* شاشة الفيديوهات */
        #video-screen { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 3000; flex-direction: column; }
        .video-container { flex: 1; position: relative; display: flex; justify-content: center; align-items: center; }
        #remote-video { width: 100%; height: 100%; object-fit: cover; }
        #local-video { position: absolute; top: 20px; right: 20px; width: 110px; height: 150px; border-radius: 12px; border: 2px solid #fff; object-fit: cover; }
        .call-controls { padding: 20px; background: #0f172a; display: flex; justify-content: center; gap: 20px; }
        .btn-ctrl { width: 50px; height: 50px; border-radius: 50%; border: none; background: #334155; color: white; font-size: 18px; cursor: pointer; }
        .btn-end { background: #ef4444; }
    </style>
</head>
<body>

    <!-- تسجيل باليوزر -->
    <div id="login-screen">
        <div class="login-card">
            <h2>تسجيل اليوزر 👤</h2>
            <p>أدخل اسم المستخدم (Username) الخاص بك</p>
            <input type="text" id="username-input" class="login-input" placeholder="اسم المستخدم مثل: yazeed..." autocomplete="off">
            <button class="btn-main" onclick="registerUser()">دخول الحساب</button>
        </div>
    </div>

    <!-- التخطيط العام -->
    <div id="app-layout">
        <!-- قائمة اليوزرات المتصلة -->
        <div id="sidebar">
            <div class="sidebar-header">
                <div>
                    <h3>المتصلون</h3>
                    <span class="user-tag" id="my-username-display"></span>
                </div>
                <button class="btn-logout" onclick="logout()">خروج</button>
            </div>
            <ul id="user-list"></ul>
        </div>

        <!-- منطقة الشات والمكالمة -->
        <div id="chat-area">
            <div id="chat-header">
                <div class="chat-title">
                    <h4 id="active-chat-user">اختر يوزر للبدء</h4>
                </div>
                <button class="btn-call" id="call-btn" onclick="initiatePrivateCall()">📞 اتصال خاص</button>
            </div>

            <div id="messages-container"></div>

            <form id="chat-form" onsubmit="sendPrivateMessage(event)">
                <input type="text" id="message-input" placeholder="اكتب رسالتك الخاصة..." autocomplete="off" disabled required>
                <button type="submit" class="btn-send" id="send-btn" disabled>إرسال</button>
            </form>
        </div>
    </div>

    <!-- نافذة طلب الاتصال -->
    <div id="call-modal">
        <div class="modal-card">
            <h3 id="caller-text">يوزر يدعوك لمكالمة خاصة</h3>
            <div class="modal-actions">
                <button class="btn-accept" onclick="acceptCall()">قبول</button>
                <button class="btn-reject" onclick="rejectCall()">رفض</button>
            </div>
        </div>
    </div>

    <!-- شاشة الاتصال النشط -->
    <div id="video-screen">
        <div class="video-container">
            <video id="remote-video" autoplay playsinline></video>
            <video id="local-video" autoplay playsinline muted></video>
        </div>
        <div class="call-controls">
            <button class="btn-ctrl" onclick="toggleAudio()">🎤</button>
            <button class="btn-ctrl btn-end" onclick="endCall()">🛑</button>
            <button class="btn-ctrl" onclick="toggleVideo()">📹</button>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let myUsername = '';
        let selectedUser = null;
        let privateStore = {};
        let targetSocketId = null;
        let localStream = null;
        let peerConnection = null;

        const rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };

        // التحقق عند فتح الصفحة إذا كان الحساب محفوظاً سابقاً
        window.onload = () => {
            const savedUsername = localStorage.getItem('app_saved_user');
            if (savedUsername) {
                myUsername = savedUsername;
                loginSuccess();
            }
        };

        function registerUser() {
            const input = document.getElementById('username-input').value.trim();
            if (input) {
                myUsername = input;
                localStorage.setItem('app_saved_user', myUsername); // حفظ في المتصفح
                loginSuccess();
            }
        }

        function loginSuccess() {
            socket.emit('register-user', myUsername);
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('my-username-display').innerText = `@${myUsername}`;
        }

        function logout() {
            localStorage.removeItem('app_saved_user'); // مسح اليوزر الحساب
            location.reload(); // إعادة التحميل لإظهار شاشة الدخول
        }

        // تحديث قائمة اليوزرات من السيرفر
        socket.on('update-user-list', (userArray) => {
            const list = document.getElementById('user-list');
            list.innerHTML = '';

            userArray.forEach(user => {
                if (user !== myUsername) {
                    const li = document.createElement('li');
                    li.className = `user-item ${selectedUser === user ? 'active' : ''}`;
                    li.innerHTML = `<span>@${user}</span><span class="badge-online"></span>`;
                    li.onclick = () => selectUserChat(user);
                    list.appendChild(li);
                }
            });
        });

        // اختيار يوزر للتحدث معه
        function selectUserChat(user) {
            selectedUser = user;
            document.getElementById('active-chat-user').innerText = `محادثة خاصة مع @${user}`;
            document.getElementById('message-input').disabled = false;
            document.getElementById('send-btn').disabled = false;
            document.getElementById('call-btn').style.display = 'block';

            renderMessages();
        }

        // إرسال رسالة خاصة
        function sendPrivateMessage(e) {
            e.preventDefault();
            const input = document.getElementById('message-input');
            const text = input.value.trim();

            if (text && selectedUser) {
                if (!privateStore[selectedUser]) privateStore[selectedUser] = [];
                privateStore[selectedUser].push({ from: myUsername, text: text });

                socket.emit('private-message', { to: selectedUser, from: myUsername, text: text });
                input.value = '';
                renderMessages();
            }
        }

        // استقبال رسالة خاصة
        socket.on('private-message', (data) => {
            if (!privateStore[data.from]) privateStore[data.from] = [];
            privateStore[data.from].push({ from: data.from, text: data.text });

            if (selectedUser === data.from) {
                renderMessages();
            }
        });

        function renderMessages() {
            const container = document.getElementById('messages-container');
            container.innerHTML = '';
            const messages = privateStore[selectedUser] || [];

            messages.forEach(msg => {
                const box = document.createElement('div');
                const isMe = msg.from === myUsername;
                box.className = `message-box ${isMe ? 'message-outgoing' : 'message-incoming'}`;
                box.innerText = msg.text;
                container.appendChild(box);
            });
            container.scrollTop = container.scrollHeight;
        }

        // --- نظام الاتصال الفردي (Private Call) ---
        function initiatePrivateCall() {
            if (!selectedUser) return;
            socket.emit('call-request', { to: selectedUser, from: myUsername });
            alert(`جاري الاتصال بـ @${selectedUser}...`);
        }

        socket.on('incoming-call', (data) => {
            targetSocketId = data.fromSocketId;
            document.getElementById('caller-text').innerText = `@${data.fromUser} يتصل بك في مكالمة خاصة!`;
            document.getElementById('call-modal').style.display = 'flex';
        });

        async function acceptCall() {
            document.getElementById('call-modal').style.display = 'none';
            socket.emit('call-response', { toSocketId: targetSocketId, accepted: true });
            await startLocalStream();
            createPeerConnection();
        }

        function rejectCall() {
            document.getElementById('call-modal').style.display = 'none';
            socket.emit('call-response', { toSocketId: targetSocketId, accepted: false });
        }

        socket.on('call-status', async (data) => {
            if (data.accepted) {
                targetSocketId = data.fromSocketId;
                await startLocalStream();
                createPeerConnection();

                const offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);
                socket.emit('webrtc-offer', { toSocketId: targetSocketId, sdp: offer });
            } else {
                alert('تم رفض الاتصال.');
            }
        });

        async function startLocalStream() {
            localStream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            document.getElementById('local-video').srcObject = localStream;
            document.getElementById('video-screen').style.display = 'flex';
        }

        function createPeerConnection() {
            peerConnection = new RTCPeerConnection(rtcConfig);
            localStream.getTracks().forEach(track => peerConnection.addTrack(track, localStream));

            peerConnection.ontrack = (e) => {
                document.getElementById('remote-video').srcObject = e.streams[0];
            };

            peerConnection.onicecandidate = (e) => {
                if (e.candidate) {
                    socket.emit('webrtc-ice-candidate', { toSocketId: targetSocketId, candidate: e.candidate });
                }
            };
        }

        socket.on('webrtc-offer', async (data) => {
            if (!peerConnection) createPeerConnection();
            await peerConnection.setRemoteDescription(new RTCSessionDescription(data.sdp));
            const answer = await peerConnection.createAnswer();
            await peerConnection.setLocalDescription(answer);
            socket.emit('webrtc-answer', { toSocketId: targetSocketId, sdp: answer });
        });

        socket.on('webrtc-answer', async (data) => {
            await peerConnection.setRemoteDescription(new RTCSessionDescription(data.sdp));
        });

        socket.on('webrtc-ice-candidate', async (data) => {
            if (peerConnection) {
                await peerConnection.addIceCandidate(new RTCIceCandidate(data.candidate));
            }
        });

        function toggleAudio() {
            localStream.getAudioTracks()[0].enabled = !localStream.getAudioTracks()[0].enabled;
        }

        function toggleVideo() {
            localStream.getVideoTracks()[0].enabled = !localStream.getVideoTracks()[0].enabled;
        }

        function endCall() {
            if (localStream) localStream.getTracks().forEach(t => t.stop());
            if (peerConnection) peerConnection.close();
            document.getElementById('video-screen').style.display = 'none';
            location.reload();
        }
    </script>
</body>
</html>
